name: Orion generated workflow check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  generated-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e services/orion-decision
      - run: python -m orion_decision.gha_workflows --check
