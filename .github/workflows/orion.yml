    - test_gate
    - recipe_gate
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'libfuzzer') }}
