    - publish-docker
    if: always() && !cancelled() && needs.graph-result.result == 'success' && (needs.publish-docker.result
      == 'success' || needs.plan.outputs.selected_docker_jobs == '[]') && fromJSON(needs.plan.outputs.plan_json).publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python -m pip install -e services/orion-decision
    - name: Write plan and bind exact build artifacts
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ORION_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
      run: 'printf ''%s'' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"

        python -m orion_decision.gha_publish manifest --plan-file "$RUNNER_TEMP/plan.json"
        --output "$RUNNER_TEMP/manifest.json"'
    - uses: actions/upload-artifact@v5
      with:
        name: orion-publication-manifest-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/manifest.json
        if-no-files-found: error
        retention-days: 7
  publication-worker:
    name: Import Taskcluster publication artifacts
    needs:
    - plan
    - publication-manifest
    if: always() && !cancelled() && needs.publication-manifest.result == 'success'
      && fromJSON(needs.plan.outputs.plan_json).publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_ACCESS_TOKEN }}
      TASKCLUSTER_CLIENT_ID: project/fuzzing/worker-orion-gha-publish-gh
      TASKCLUSTER_ROOT_URL: https://community-tc.services.mozilla.com
      TC_WORKER_ID: gh-orion-publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python -m pip install -e services/orion-decision
    - uses: actions/download-artifact@v5
      with:
        name: orion-publication-manifest-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/orion-publication
    - name: Write protected GitHub token file
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ORION_GITHUB_TOKEN_FILE: ${{ runner.temp }}/orion-github-token
      run: 'umask 077

        printf ''%s'' "$GITHUB_TOKEN" > "$ORION_GITHUB_TOKEN_FILE"

        chmod 0600 "$ORION_GITHUB_TOKEN_FILE"'
    - name: Ensure exact import tasks exist
      env:
        ORION_RUN_ID: ${{ github.run_id }}
        ORION_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: '# Webhook decisions can run before manifest upload.

        # Deterministic IDs make this idempotent for every run.

        group=$(python -c ''from orion_decision.gha_publish import artifact_task_id;
        import os; print(artifact_task_id(os.environ["ORION_RUN_ID"], os.environ["ORION_RUN_ATTEMPT"],
        "decision"))'')

        python -m orion_decision.gha_publish schedule --manifest-file "$RUNNER_TEMP/orion-publication/manifest.json"
        --task-group "$group"'
    - name: Run worker and require every exact import
      env:
        ORION_GITHUB_TOKEN_FILE: ${{ runner.temp }}/orion-github-token
      run: 'set +e

        .github/scripts/start-worker.sh > "$RUNNER_TEMP/generic-worker.log" 2>&1 &

        worker_pid=$!

        python -m orion_decision.gha_publish monitor --manifest-file "$RUNNER_TEMP/orion-publication/manifest.json"
        --timeout 3600 > "$RUNNER_TEMP/publication-monitor.log" 2>&1 &

        monitor_pid=$!

        wait "$monitor_pid"

        monitor_status=$?

        if kill -0 "$worker_pid" 2>/dev/null; then kill -TERM "$worker_pid"; fi

        wait "$worker_pid"

        cat "$RUNNER_TEMP/generic-worker.log"

        cat "$RUNNER_TEMP/publication-monitor.log"

        exit "$monitor_status"'
  publish-docker:
    name: Publish Orion Docker manifests
    needs:
    - plan
    - graph-result
    if: always() && !cancelled() && needs.graph-result.result == 'success' && needs.plan.outputs.selected_docker_jobs
      != '[]' && fromJSON(needs.plan.outputs.plan_json).publish && vars.ORION_DOCKER_PUBLISH
      == 'true'
    runs-on: ubuntu-24.04
    environment: dockerhub
    concurrency:
      group: orion-docker-latest-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python -m pip install -e services/orion-decision
    - name: Write plan and install zstd
      env:
        ORION_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
      run: 'printf ''%s'' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"

        sudo apt-get update && sudo apt-get install --yes zstd'
    - name: Reject stale branch publication
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ORION_REVISION: ${{ github.sha }}
        ORION_BRANCH: ${{ github.ref_name }}
      run: python -m orion_decision.gha_run check-head --repository "$GITHUB_REPOSITORY"
        --branch "$ORION_BRANCH" --revision "$ORION_REVISION"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push staging images and publish latest manifests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python -m orion_decision.gha_run publish --repo . --plan-file "$RUNNER_TEMP/plan.json"
    - name: Record published image digests
      uses: actions/upload-artifact@v5
      with:
        name: orion-published-image-digests-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/published-images.json
        if-no-files-found: error
        retention-days: 90
