      arch: amd64
      base: https://github.com/msys2/msys2-installer/releases/download/2023-10-26/msys2-base-x86_64-20231026.tar.xz
  publish:
    needs:
    - plan
    - test_gate
    - recipe_gate
    - build_afl
    - build_base_node
    - build_base_python
    - build_bugmon
    - build_bugmon_win
    - build_covdiff
    - build_coverage_revision
    - build_domino_web_tests
    - build_funfuzz
    - build_fuzzilli
    - build_fuzzing_decision
    - build_grizzly
    - build_grizzly_android
    - build_grizzly_reduce_monitor
    - build_grizzly_win
    - build_js_tests_distiller
    - build_langfuzz
    - build_libfuzzer
    - build_neqo_coverage
    - build_nss_corpus_update
    - build_nss_coverage
    - build_nyx
    - build_prefmonitor
    - build_site_scout
    - build_site_scout_android
    - build_site_scout_win
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(needs.*.result,
      'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.publish_matrix || '{"include":[{"service":""}]}') }}
    runs-on: ubuntu-24.04
    env:
      TASKCLUSTER_CLIENT_ID: ${{ secrets.TASKCLUSTER_CLIENT_ID }}
      TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TASKCLUSTER_ROOT_URL: ${{ vars.TASKCLUSTER_ROOT_URL || 'https://firefox-ci-tc.services.mozilla.com' }}
    steps:
    - if: ${{ matrix.service != '' }}
      uses: actions/checkout@v6
    - if: ${{ matrix.service != '' }}
      uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.12'
        cache-dependency-glob: ci/uv.lock
    - if: ${{ matrix.service != '' }}
      name: Install publisher dependencies
      run: uv sync --project ci --locked --no-dev
    - if: ${{ matrix.service != '' }}
      name: Install Podman and zstd
      run: sudo apt-get update && sudo apt-get install -y podman zstd
    - if: ${{ matrix.service != '' }}
      name: Download plan
      uses: actions/download-artifact@v5
      with:
        name: orion-plan
        path: .
    - if: ${{ matrix.service != '' }}
      name: Download exact service artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: uv run --project ci --locked --no-dev python -m ci.download_publication --plan plan.json --service '${{
        matrix.service }}' --run-id '${{ github.run_id }}' --repository '${{ github.repository }}' --token "$GH_TOKEN"
        --output artifacts
    - if: ${{ matrix.service != '' }}
      name: Publish ${{ matrix.service }}
      run: uv run --project ci --locked --no-dev python -m ci.publish --plan plan.json --artifacts artifacts --service
        '${{ matrix.service }}'
  complete:
    needs:
    - plan
    - tests
    - ci_tests
    - test_gate
    - recipes
    - recipe_gate
    - build_afl
    - build_base_node
    - build_base_python
    - build_bugmon
    - build_bugmon_win
    - build_covdiff
    - build_coverage_revision
    - build_domino_web_tests
    - build_funfuzz
    - build_fuzzilli
    - build_fuzzing_decision
    - build_grizzly
    - build_grizzly_android
    - build_grizzly_reduce_monitor
    - build_grizzly_win
    - build_js_tests_distiller
    - build_langfuzz
    - build_libfuzzer
    - build_neqo_coverage
    - build_nss_corpus_update
    - build_nss_coverage
    - build_nyx
    - build_prefmonitor
    - build_site_scout
    - build_site_scout_android
    - build_site_scout_win
    - publish
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Fail the required check if any job failed or was cancelled
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: python -c "import json,os,sys; s=[j['result'] for j in json.loads(os.environ['NEEDS']).values()]; sys.exit(any(x
        in {'failure','cancelled'} for x in s))"
