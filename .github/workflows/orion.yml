        \ item['result'] for name, item in needs.items()\n}\nfailed = [\n    job for\
        \ job in selected if results.get(job) != 'success'\n]\nif failed:\n    print('Selected\
        \ jobs did not succeed:', ', '.join(failed))\n    sys.exit(1)\nPY"
      env:
        ORION_SELECTED_JOBS: ${{ needs.plan.outputs.selected_jobs }}
        ORION_JOB_RESULTS: ${{ toJSON(needs) }}
