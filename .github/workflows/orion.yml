name: Orion CI and builds
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every image and rerun recipe checks
        required: false
        default: false
        type: boolean
  schedule:
  - cron: 17 5 * * 1
permissions:
  actions: read
  contents: read
concurrency:
  group: orion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      dirty: ${{ steps.plan.outputs.dirty }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      recipe_matrix: ${{ steps.plan.outputs.recipe_matrix }}
      publish_matrix: ${{ steps.plan.outputs.publish_matrix }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.12'
        cache-dependency-glob: ci/uv.lock
    - name: Install workflow tools
      run: uv sync --project ci --locked --no-dev
    - id: baseline
      name: Find the last successfully published revision
      env:
        GH_TOKEN: ${{ github.token }}
      run: uv run --project ci --locked --no-dev python -m ci.baseline
    - id: plan
      name: Plan tests and image builds
      env:
        BASE: ${{ steps.baseline.outputs.base }}
        REBUILD_ALL: ${{ inputs.rebuild_all }}
      shell: bash
      run: |-
        all_args=()
        if [[ "$GITHUB_EVENT_NAME" == "schedule" || ("$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REBUILD_ALL" == "true") ]]; then
          all_args+=(--all)
        fi
        uv run --project ci --locked --no-dev python -m ci.plan --base "$BASE" --head "$GITHUB_SHA" --output plan.json "${all_args[@]}"
        uv run --project ci --locked --no-dev python - <<'PY'
        import json, os
        from pathlib import Path
        plan = json.loads(Path('plan.json').read_text())
        services = plan['services']
        buildable = {'docker', 'msys', 'homebrew'}
        publish = [{'service': name} for name in plan['dirty'] if services[name]['kind'] in buildable]
        recipes = [{'recipe': name} for name in plan['recipes']]
        tests = [item for item in plan['test_matrix'] if item['service'] != 'orion']
        root_tests = plan['services'].get('orion', {}).get('tests', [])
        for item in root_tests:
            tests.append({'service': 'orion', 'path': '.', 'python': item.get('python', '3.10'), 'toxenv': item.get('toxenv', 'lint'), 'name': item.get('name', 'root lint')})
        tests = tests or [{'service': '', 'path': '.', 'python': '3.10', 'toxenv': 'lint', 'name': ''}]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('dirty=' + json.dumps(plan['dirty'], separators=(',', ':')) + '\n')
            output.write('test_matrix=' + json.dumps({'include': tests}, separators=(',', ':')) + '\n')
            output.write('recipe_matrix=' + json.dumps({'include': recipes or [{'recipe': ''}]}, separators=(',', ':')) + '\n')
            output.write('publish_matrix=' + json.dumps({'include': publish or [{'service': ''}]}, separators=(',', ':')) + '\n')
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: orion-plan
        path: plan.json
        retention-days: 2
  tests:
    needs:
    - plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix || '{"include":[{"service":"","path":".","python":"3.10","toxenv":"lint","name":""}]}')
        }}
    steps:
    - if: ${{ matrix.service != '' }}
      uses: actions/checkout@v6
    - if: ${{ matrix.service != '' }}
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python }}
        cache-dependency-glob: ci/uv.lock
    - if: ${{ matrix.service != '' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - if: ${{ matrix.service != '' }}
      name: Run ${{ matrix.name }}
      working-directory: ${{ matrix.path }}
      run: uv tool run tox -e ${{ matrix.toxenv }}
  ci_tests:
    needs:
    - plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.12'
        cache-dependency-glob: ci/uv.lock
    - name: Install CI test dependencies
      run: uv sync --project ci --locked
    - name: Test planner, builder, workflow and publisher
      run: uv run --project ci --locked python -m pytest -q ci/tests
  test_gate:
    needs:
    - tests
    - ci_tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Require all test jobs to pass
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: python -c "import json,os,sys; s=[j['result'] for j in json.loads(os.environ['NEEDS']).values()]; sys.exit(any(x
        in {'failure','cancelled'} for x in s))"
  recipes:
    needs:
    - plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.recipe_matrix || '{"include":[{"recipe":""}]}') }}
    steps:
    - if: ${{ matrix.recipe != '' }}
      uses: actions/checkout@v6
    - if: ${{ matrix.recipe != '' }}
      name: Install Podman
      run: sudo apt-get update && sudo apt-get install -y podman
    - name: Test Linux recipe ${{ matrix.recipe }}
      if: ${{ matrix.recipe != '' }}
      shell: bash
      run: |-
        recipe="${{ matrix.recipe }}"
        dockerfile="services/test-recipes/Dockerfile-${recipe%.sh}"
        if [[ ! -f "$dockerfile" ]]; then dockerfile=services/test-recipes/Dockerfile; fi
        podman build --file "$dockerfile" --build-arg "recipe=$recipe" .
  recipe_gate:
    needs:
    - recipes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Require all recipe jobs to pass
      env:
        RESULT: ${{ needs.recipes.result }}
      run: test "$RESULT" != failure && test "$RESULT" != cancelled
  build_afl:
    needs:
    - plan
    - test_gate
    - recipe_gate
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'afl') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: afl
      kind: docker
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
  build_base_node:
    needs:
    - plan
    - test_gate
    - recipe_gate
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'base-node') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: base-node
      kind: docker
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
  build_base_python:
    needs:
    - plan
    - test_gate
    - recipe_gate
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'base-python') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: base-python
      kind: docker
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
  build_bugmon:
    needs:
    - plan
    - test_gate
    - recipe_gate
    - build_grizzly
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'bugmon') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: bugmon
      kind: docker
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
  build_bugmon_win:
    needs:
    - plan
    - test_gate
    - recipe_gate
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'bugmon-win') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: bugmon-win
      kind: msys
      arch: amd64
      base: https://github.com/msys2/msys2-installer/releases/download/2022-10-28/msys2-base-x86_64-20221028.tar.xz
  build_covdiff:
    needs:
    - plan
    - test_gate
    - recipe_gate
    - build_base_python
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(fromJSON(needs.plan.outputs.dirty
      || '[]'), 'covdiff') }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: covdiff
      kind: docker
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
