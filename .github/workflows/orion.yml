      'build_site_scout_win_amd64')) && (needs.index_site_scout_win_amd64.result ==
      'success' || !contains(fromJSON(needs.plan.outputs.selected_jobs), 'build_site_scout_win_amd64'))
    uses: ./.github/workflows/publish-service.yml
