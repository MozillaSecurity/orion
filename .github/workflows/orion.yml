    if: always() && !cancelled() && fromJSON(needs.plan.outputs.plan_json).publish
    runs-on: ubuntu-24.04
    environment: communitytc
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python -m pip install -e services/orion-decision
    - name: Close publication submissions
      env:
        TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_GH_ORION_PUBLISHER_ACCESS_TOKEN
          }}
        TASKCLUSTER_CLIENT_ID: project/fuzzing/gh-orion-publisher
        TASKCLUSTER_ROOT_URL: ${{ vars.TASKCLUSTER_ROOT_URL }}
        GITHUB_TOKEN: ${{ github.token }}
        ORION_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        ORION_JOB_RESULTS: ${{ toJSON(needs) }}
        ORION_TASK_GROUP: ${{ needs.publication-bootstrap.outputs.task_group }}
      run: 'printf ''%s'' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"

        python -m orion_decision.gha_publish close --plan-file "$RUNNER_TEMP/plan.json"
        --task-group "$ORION_TASK_GROUP" --output "$RUNNER_TEMP/publication-control.json"'
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: orion-publication-control-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/publication-control.json
        if-no-files-found: error
        retention-days: 7
  publication-workers:
    name: Taskcluster worker ${{ matrix.worker }}
    needs:
    - plan
    if: always() && !cancelled() && fromJSON(needs.plan.outputs.plan_json).publish
    runs-on: ubuntu-24.04
    environment: communitytc
    strategy:
      fail-fast: false
      matrix:
        worker:
        - 1
        - 2
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python -m pip install -e services/orion-decision
    - name: Write protected GitHub token file
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ORION_GITHUB_TOKEN_FILE: ${{ runner.temp }}/orion-github-token
      run: 'umask 077

        printf ''%s'' "$GITHUB_TOKEN" > "$ORION_GITHUB_TOKEN_FILE"

        chmod 0600 "$ORION_GITHUB_TOKEN_FILE"'
    - name: Run worker pool
      env:
        TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_CI_WORKER_ORION_GHA_ACCESS_TOKEN
          }}
        TASKCLUSTER_CLIENT_ID: project/fuzzing/ci-worker-orion-gha
        TASKCLUSTER_ROOT_URL: ${{ vars.TASKCLUSTER_ROOT_URL }}
        GITHUB_TOKEN: ${{ github.token }}
        ORION_GITHUB_TOKEN_FILE: ${{ runner.temp }}/orion-github-token
        ORION_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        TC_WORKER_ID: gh-orion-publish-${{ github.run_id }}-${{ github.run_attempt
          }}-${{ matrix.worker }}
      run: 'printf ''%s'' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"

        python -m orion_decision.gha_publish worker-pool --plan-file "$RUNNER_TEMP/plan.json"
        --timeout 16200'
    timeout-minutes: 360
  result:
    name: Orion workflow result
    needs:
    - plan
    - graph-result
    - publication-done
    - publication-workers
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require graph and publication success
      env:
        ORION_GRAPH_RESULT: ${{ needs.graph-result.result }}
        ORION_PUBLISH: ${{ needs.plan.outputs.publish }}
        ORION_PUBLICATION_RESULT: ${{ needs.publication-done.result }}
        ORION_WORKERS_RESULT: ${{ needs.publication-workers.result }}
      run: "python - <<'PY'\nimport os, sys\nif os.environ['ORION_GRAPH_RESULT'] !=\
        \ 'success':\n    sys.exit('Selected Orion graph jobs did not all succeed')\n\
        if os.environ['ORION_PUBLISH'] == 'true':\n    if os.environ['ORION_PUBLICATION_RESULT']\
        \ != 'success':\n        sys.exit('Publication submissions failed')\n    if\
        \ os.environ['ORION_WORKERS_RESULT'] != 'success':\n        sys.exit('Workers\
        \ did not drain')\nPY"
