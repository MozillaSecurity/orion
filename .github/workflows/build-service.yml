name: Orion graph operation

on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      name:
        type: string
        required: true
      arch:
        type: string
        required: true
      revision:
        type: string
        required: true
      runner:
        type: string
        required: true
      plan_json:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Preserve LF line endings in Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install decision package
        run: python -m pip install -e services/orion-decision
      - name: Write plan and install zstd
        env:
          ORION_PLAN_JSON: ${{ inputs.plan_json }}
        shell: bash
        run: |
          printf '%s' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes zstd
          elif [[ "$RUNNER_OS" == macOS ]]; then
            brew install zstd
          fi
      - name: Set up Docker Buildx
        if: runner.os == 'Linux' && inputs.operation != 'service-test'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: Prepare graph operation
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORION_TASKCLUSTER_ROOT_URL: ${{ vars.ORION_TASKCLUSTER_ROOT_URL }}
          ORION_OPERATION: ${{ inputs.operation }}
          ORION_SERVICE_NAME: ${{ inputs.name }}
          ORION_ARCH: ${{ inputs.arch }}
          ORION_REVISION: ${{ inputs.revision }}
        shell: bash
        run: >-
          python -m orion_decision.gha_run prepare
          --operation "$ORION_OPERATION"
          --name "$ORION_SERVICE_NAME"
          --arch "$ORION_ARCH"
          --revision "$ORION_REVISION"
          --plan-file "$RUNNER_TEMP/plan.json"
      - name: Build recipe test image
        if: inputs.operation == 'recipe-test'
        id: recipe
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.prepare.outputs.build_context }}
          file: ${{ steps.prepare.outputs.build_file }}
          tags: ${{ steps.prepare.outputs.build_tags }}
          build-args: ${{ steps.prepare.outputs.build_args }}
          load: true
      - name: Run service tests
        if: inputs.operation == 'service-test'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORION_SERVICE_NAME: ${{ inputs.name }}
          ORION_REVISION: ${{ inputs.revision }}
        shell: bash
        run: >-
          python -m orion_decision.gha_run run
          --operation service-test
          --name "$ORION_SERVICE_NAME"
          --revision "$ORION_REVISION"
          --plan-file "$RUNNER_TEMP/plan.json"
      - name: Build Docker service
        if: inputs.operation == 'build' && runner.os == 'Linux'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.prepare.outputs.build_context }}
          file: ${{ steps.prepare.outputs.build_file }}
          tags: ${{ steps.prepare.outputs.build_tags }}
          load: true
          platforms: linux/${{ inputs.arch }}
          provenance: false
      - name: Finalize Docker archive
        if: inputs.operation == 'build' && runner.os == 'Linux'
        env:
          ORION_SERVICE_NAME: ${{ inputs.name }}
          ORION_ARCH: ${{ inputs.arch }}
          ORION_IMAGE_TAR: ${{ steps.prepare.outputs.image_tar }}
          ORION_DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          python -m orion_decision.gha_run finalize
          --name "$ORION_SERVICE_NAME"
          --arch "$ORION_ARCH"
          --image-tar "$ORION_IMAGE_TAR"
          --digest "$ORION_DIGEST"
      - name: Upload Docker build artifact
        if: inputs.operation == 'build' && runner.os == 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: orion-build-${{ inputs.name }}-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ inputs.name }}-${{ inputs.arch }}.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: Upload native environment artifact
        if: inputs.operation == 'build' && runner.os != 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: orion-build-${{ inputs.name }}-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.native_archive }}
          if-no-files-found: error
          retention-days: 7
