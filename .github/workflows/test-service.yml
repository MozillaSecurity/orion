name: Orion native service tests

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      revision:
        type: string
        required: true
      plan_json:
        type: string
        required: true
      tests_json:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  run:
    name: ${{ inputs.name }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tests_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools and decision package
        run: python -m pip install tox -e services/orion-decision
      - name: Write plan
        env:
          ORION_PLAN_JSON: ${{ inputs.plan_json }}
        shell: bash
        run: printf '%s' "$ORION_PLAN_JSON" > "$RUNNER_TEMP/plan.json"
      - name: Run service test
        env:
          ORION_SERVICE_NAME: ${{ inputs.name }}
          ORION_REVISION: ${{ inputs.revision }}
          ORION_TEST_INDEX: ${{ matrix.test_index }}
        shell: bash
        run: >-
          python -m orion_decision.gha_run run
          --operation service-test
          --name "$ORION_SERVICE_NAME"
          --revision "$ORION_REVISION"
          --plan-file "$RUNNER_TEMP/plan.json"
          --test-index "$ORION_TEST_INDEX"
