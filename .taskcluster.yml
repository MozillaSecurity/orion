version: 1
tasks:
  $if: tasks_for == "github-push" && event.ref == "refs/heads/master"
  then:
    - created: {$fromNow: ''}
      deadline: {$fromNow: '1 day'}
      provisionerId: proj-fuzzing
      workerType: orion-gha-publish
      schedulerId: taskcluster-github
      payload:
        features:
          taskclusterProxy: true
        maxRunTime: 3600
        env:
          GITHUB_EVENT: {$json: {$eval: event}}
          GITHUB_ACTION: ${tasks_for}
          ORION_REPOSITORY_URL: https://github.com/${event.repository.full_name}.git
          ORION_REVISION: ${event.after}
        command:
          - - bash
            - -e
            - -c
            - >
              work="$(mktemp -d .orion-decision.XXXXXX)";
              trap 'rm -rf "$work"' EXIT;
              git -C "$work" init -q;
              git -C "$work" remote add origin "$ORION_REPOSITORY_URL";
              git -C "$work" fetch -q --depth=1 origin "$ORION_REVISION";
              git -C "$work" checkout -q FETCH_HEAD;
              export PYTHONPATH="$work/services/orion-decision/src";
              python -m orion_decision.gha_publish decision --github-action "$GITHUB_ACTION" --task-group "$TASK_ID"
      scopes:
        - queue:create-task:highest:proj-fuzzing/orion-gha-publish
        - queue:route:index.project.fuzzing.orion.*
        - queue:scheduler-id:taskcluster-github
      metadata:
        name: Orion GHA publication decision
        description: Find the exact successful GHA run and schedule artifact imports
        owner: truber@mozilla.com
        source: https://github.com/MozillaSecurity/orion
  else: []
