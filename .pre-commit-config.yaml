repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff-check
        args: ['--fix']
        files: ^(scripts|ci)/.*\.py$
      - id: ruff-format
        files: ^(scripts|ci)/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: trailing-whitespace
        exclude: '\.diff$'
      - id: mixed-line-ending
      - id: name-tests-test
        args: ['--django']
      - id: check-json
      - id: requirements-txt-fixer
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude_types: [json]
        exclude: ^(.*\.ron)|(pools*.yaml)$
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    - id: detect-secrets
      args: ['--baseline', '.secrets.baseline']
      exclude: \.yaml$|/tests/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--exclude=SC1091,SC2148']
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci', '-s', '-w']
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: local
    hooks:
      - id: orion-service-load
        name: Check Orion service and recipe graph
        entry: uv run --project ci --locked --no-dev python -m ci.graph --check
        language: python
        additional_dependencies: [uv]
        always_run: true
        require_serial: true
        pass_filenames: false
        verbose: true
      - id: orion-workflow-generated
        name: Check generated GitHub Actions workflow
        entry: uv run --project ci --locked --no-dev python -m ci.workflows --check
        language: python
        additional_dependencies: [uv]
        always_run: true
        require_serial: true
        pass_filenames: false
      - id: orion-ci-tests
        name: Test CI tooling
        entry: uv run --project ci --locked python -m pytest -q ci/tests
        language: python
        additional_dependencies: [uv]
        files: ^ci/.*(\.py|\.toml|\.lock)$
        pass_filenames: false
      - id: hadolint
        name: Lint dockerfiles
        language: system
        files: "Dockerfile(-[A-Za-z_.-]+)?"
        require_serial: true
        entry: ./scripts/pre-commit-hadolint.sh
      - id: grizzly-lint
        name: Run linters for grizzly
        entry: bash -c 'cd services/grizzly && exec tox -e lint'
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^services/grizzly/.*
      - id: grizzly-reduce-monitor-lint
        name: Run linters for grizzly_reduce_monitor
        entry: bash -c 'cd services/grizzly-reduce-monitor && exec tox -e lint'
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^services/grizzly-reduce-monitor/.*
      - id: fuzzing-decision-lint
        name: Run linters for fuzzing_decision
        entry: bash -c 'cd services/fuzzing-decision && exec tox -e lint'
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^services/fuzzing-decision/.*
      - id: nyx-ipc-manager-lint
        name: Run linters for nyx-ipc-manager
        entry: bash -c 'cd services/nyx/nyx_ipc_manager && exec tox -e lint'
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^services/nyx/nyx_ipc_manager/.*
      - id: symbol-filter-lint
        name: Run linters for symbol-filter
        entry: bash -c 'cd services/nyx/symbol-filter && exec tox -e lint'
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^services/nyx/symbol-filter/.*

default_language_version:
  python: python3
